<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil Member</title>

    <link rel="stylesheet" href="Member.css">
</head>

<body>

    <div class="profile-container">

        <a href="index.html" class="back-btn">Kembali</a>
        
        <div class="profile-card">

            <div class="profile-image">
                <img id="memberImage" src="kucing.jpg" alt="Foto Member">
            </div>

            <div class="profile-info">

                <span id="memberRole" class="role">
                    Member
                </span>

                <h1 id="memberName">
                    memberName
                </h1>

                <p id="memberUsername" class="username">
                    @username
                </p>

                <div class="line"></div>

                <h3>Tentang</h3>

                <p id="memberBio">
                    Informasi member...
                </p>

                <div class="info-grid">

                    <div class="info-box">
                        <span>🎮 Favorite Game</span>
                        <strong id="memberGame">
                            -
                        </strong>
                    </div>

                    <div class="info-box">
                        <span>📅 Bergabung</span>
                        <strong id="memberJoin">
                            -
                        </strong>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="Member.js"></script>

</body>
</html>
